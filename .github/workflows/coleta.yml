# Automação que roda o coleta.py sozinho a cada hora
name: Coleta de dados SPTrans

on:
  schedule:
    - cron: "0 * * * *"   # a cada hora, no minuto 0 (horário UTC)
  workflow_dispatch:      # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write         # permite salvar o CSV de volta no repositório

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt

      - name: Rodar a coleta
        env:
          SPTRANS_TOKEN: ${{ secrets.SPTRANS_TOKEN }}
        run: python coleta.py

      - name: Salvar o CSV atualizado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/
          git diff --staged --quiet || git commit -m "Coleta automática: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
